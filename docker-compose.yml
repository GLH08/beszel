# Beszel — hub + local agent, built entirely from source (this fork).
#
# Deploy:   docker compose up -d --build
# Update:   git pull && docker compose up -d --build
#
# First-boot token/key setup is described in .env.example.

services:
  beszel:
    build:
      context: .
      dockerfile: internal/dockerfile_hub_source
    container_name: beszel
    restart: unless-stopped
    environment:
      APP_URL: ${APP_URL:-http://localhost:8090}
      # Agent image shown in the add-system install snippets. New servers can't
      # build from this fork's source, so default to the fork's prebuilt GHCR
      # agent image (with ping / processes support).
      AGENT_IMAGE: ${AGENT_IMAGE:-ghcr.io/glh08/beszel/beszel-agent:custom}
    ports:
      - "8090:8090"
    volumes:
      - ./beszel_data:/beszel_data
      - ./beszel_socket:/beszel_socket

  beszel-agent:
    build:
      context: .
      dockerfile: internal/dockerfile_agent
    container_name: beszel-agent
    restart: unless-stopped
    # host networking so the agent sees the real host NICs (upload / download / speed)
    network_mode: host
    # host PID namespace so the Top Processes feature can see all host processes
    # (otherwise the agent only sees its own container's processes)
    pid: host
    depends_on:
      - beszel
    volumes:
      - ./beszel_agent_data:/var/lib/beszel-agent
      - ./beszel_socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      LISTEN: /beszel_socket/beszel.sock
      HUB_URL: ${HUB_URL:-http://localhost:8090}
      TOKEN: ${TOKEN:-}
      KEY: ${KEY:-}
