# Beszel — hub + local agent, using prebuilt images from GHCR (built by
# .github/workflows/docker-images-fork.yml on the `custom` branch).
#
# Use this instead of docker-compose.yml when the host is too slow to build
# from source. First-boot token/key setup is described in .env.example.
#
# Deploy:   docker compose -f docker-compose.images.yml pull && docker compose -f docker-compose.images.yml up -d
# Update:   docker compose -f docker-compose.images.yml pull && docker compose -f docker-compose.images.yml up -d

services:
  beszel:
    image: ghcr.io/glh08/beszel/beszel:custom
    container_name: beszel
    restart: unless-stopped
    environment:
      APP_URL: ${APP_URL:-http://localhost:8090}
      # Agent image shown in the add-system install snippets. Defaults to the
      # fork's GHCR agent so new systems install the fork agent (with ping /
      # processes support) instead of the upstream image.
      AGENT_IMAGE: ${AGENT_IMAGE:-ghcr.io/glh08/beszel/beszel-agent:custom}
      # GitHub repo (owner/repo) for binary installs + agent self-update. Points
      # at the fork so `curl` install and `beszel-agent update` pull fork releases.
      AGENT_REPO: ${AGENT_REPO:-glh08/beszel}
    ports:
      - "8090:8090"
    volumes:
      - ./beszel_data:/beszel_data
      - ./beszel_socket:/beszel_socket

  beszel-agent:
    image: ghcr.io/glh08/beszel/beszel-agent:custom
    container_name: beszel-agent
    restart: unless-stopped
    # host networking so the agent sees the real host NICs (upload / download / speed)
    network_mode: host
    # host PID namespace so the Top Processes feature can see all host processes
    # (otherwise the agent only sees its own container's processes)
    pid: host
    depends_on:
      - beszel
    volumes:
      - ./beszel_agent_data:/var/lib/beszel-agent
      - ./beszel_socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      LISTEN: /beszel_socket/beszel.sock
      HUB_URL: ${HUB_URL:-http://localhost:8090}
      TOKEN: ${TOKEN:-}
      KEY: ${KEY:-}
