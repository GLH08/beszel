# Fork-only image build: builds the hub (with web UI) and agent from the
# `custom` branch and pushes them to GHCR so the server can `docker compose pull`
# instead of building from source on a slow host.
#
# Images:
#   ghcr.io/glh08/beszel/beszel        :custom  (+ :custom-<sha>)
#   ghcr.io/glh08/beszel/beszel-agent  :custom  (+ :custom-<sha>)
#
# Pull them on the server with docker-compose.images.yml.

name: Build fork images

on:
  push:
    branches: [custom]
  # allow manual runs from any branch
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ghcr.io/${{ github.repository }}/beszel
            dockerfile: ./internal/dockerfile_hub_source
          - image: ghcr.io/${{ github.repository }}/beszel-agent
            dockerfile: ./internal/dockerfile_agent

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=custom
            type=sha,prefix=custom-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          # cache build layers in the GitHub Actions cache to speed up rebuilds.
          # scope per image so the hub and agent caches don't collide.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
